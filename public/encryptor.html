<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question Encryptor – Science Around the Board</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        :root {
            color-scheme: light dark;
            --bg: #eef2f6; --card: #ffffff; --text: #1e293b; --muted: #55627a; --border: #dbe2ea;
            --field: #f8fafc; --accent: #2563eb; --accent-hover: #1d4ed8; --heading: #1e3a8a;
            --success: #166534; --error: #b91c1c; --chip: #e2e8f0; --link: #2563eb;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0f172a; --card: #1e293b; --text: #e8edf4; --muted: #b8c4d4; --border: #334155;
                --field: #0f172a; --accent: #2563eb; --accent-hover: #1d4ed8; --heading: #bfdbfe;
                --success: #4ade80; --error: #fca5a5; --chip: #334155; --link: #7cb8fb;
            }
        }
        * { box-sizing: border-box; }
        body {
            font-family: "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; margin: 0; padding: 16px;
            color: var(--text);
        }
        .container {
            background: var(--card); border: 1px solid var(--border);
            padding: 2.5rem; border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            width: 100%; max-width: 480px; text-align: center;
        }
        h1 { margin-top: 0; color: var(--heading); font-size: 1.8rem; }
        p { color: var(--muted); margin-bottom: 2rem; line-height: 1.5; }
        .form-group { display: flex; flex-direction: column; gap: 1.2rem; }
        input[type="text"] {
            width: 100%; padding: 14px; font-size: 16px;
            border: 2px solid var(--border); border-radius: 8px;
            background: var(--field); color: var(--text); transition: border-color 0.2s;
        }
        input[type="text"]:focus { border-color: var(--accent); }
        :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
        label { display: block; text-align: left; font-weight: 700; margin-bottom: 6px; }
        .hint { font-size: 0.85rem; color: var(--muted); text-align: left; margin: 6px 0 0; }
        .back { display: inline-block; margin-top: 1.5rem; font-size: 0.9rem; }
        input[type="file"] {
            width: 100%; padding: 10px; border: 2px dashed var(--border); border-radius: 8px;
            background: var(--field); color: var(--text); text-align: center; cursor: pointer;
        }
        input[type="file"]:hover { border-color: var(--muted); }
        input[type="file"]::file-selector-button {
            margin-right: 15px; border: none; background: var(--chip); color: var(--text);
            padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: 600;
        }
        .btn-encrypt {
            background: var(--accent); color: white; border: none; padding: 16px; font-size: 16px;
            font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; margin-top: 10px;
            transition: transform 0.1s, background 0.2s;
        }
        .btn-encrypt:hover { background: var(--accent-hover); transform: translateY(-1px); }
        .btn-encrypt:active { transform: translateY(1px); }
        #status { margin-top: 20px; font-size: 0.9rem; min-height: 20px; }
        .success { color: var(--success); }
        .error { color: var(--error); }
        a { color: var(--link); }
    </style>
</head>
<body>

    <div class="container">
        <h1>Question Encryptor</h1>
        <p>Prepare your custom question file for secure distribution to students.</p>

        <div class="form-group">
            <div>
                <label for="password">Class password</label>
                <input type="text" id="password" placeholder="e.g. spring-review-2026" autocomplete="off" aria-describedby="password-hint" />
                <p class="hint" id="password-hint">Give this password to your students in class. It is case-sensitive.</p>
            </div>

            <div>
                <label for="fileInput">Question file (.tsv)</label>
                <input type="file" id="fileInput" accept=".tsv,.txt">
            </div>

            <button class="btn-encrypt" onclick="encryptFile()">Download .lock File</button>
        </div>

        <p id="status" role="status" aria-live="polite"></p>
        <a class="back" href="./">← Back to Science Around the Board</a>
    </div>

    <script>
        function encryptFile() {
            const fileInput = document.getElementById('fileInput');
            const password = document.getElementById('password').value;
            const status = document.getElementById('status');

            // Reset status styling
            status.className = '';
            status.innerText = '';

            if (!password) {
                status.innerText = "⚠️ Please set a password first.";
                status.className = 'error';
                document.getElementById('password').focus();
                return;
            }

            if (!fileInput.files.length) {
                status.innerText = "⚠️ Please select a .tsv file.";
                status.className = 'error';
                return;
            }

            const reader = new FileReader();
            
            reader.onload = function(e) {
                try {
                    const content = e.target.result;
                    if (!content) throw new Error("File is empty");

                    // Encrypt
                    const encrypted = CryptoJS.AES.encrypt(content, password).toString();
                    
                    // Generate Filename
                    const originalName = fileInput.files[0].name.replace(/\.(tsv|txt)$/i, "");
                    const filename = `${originalName}.lock`;

                    // Create Download
                    const blob = new Blob([encrypted], {type: "text/plain"});
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement("a");
                    a.href = url;
                    a.download = filename;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    
                    status.innerText = `✅ Success! Downloaded "${filename}"`;
                    status.className = 'success';
                } catch (err) {
                    console.error(err);
                    status.innerText = "❌ Error encrypting file.";
                    status.className = 'error';
                }
            };

            reader.onerror = function() {
                status.innerText = "❌ Error reading file.";
                status.className = 'error';
            };

            reader.readAsText(fileInput.files[0]);
        }
    </script>
</body>
</html>

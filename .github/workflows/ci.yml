name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Validate example question files (game validator)
        run: npm run validate-tsv -- public/examples/16S_QIIME2_demo.tsv public/examples/intro_statistics.tsv
      - name: Validate example question files (skill's Python validator)
        run: |
          python3 .claude/skills/lab-question-writer/scripts/validate_tsv.py public/examples/16S_QIIME2_demo.tsv --images public/questionImages
          python3 .claude/skills/lab-question-writer/scripts/validate_tsv.py public/examples/intro_statistics.tsv --images public/questionImages
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run build

  e2e:
    # Plays the built app end to end (about 5 minutes), then checks consent, links and the CSP.
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke
      - run: npm run privacy
